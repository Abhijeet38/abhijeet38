name: Refresh profile stats
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_stats.py'
      - '.github/workflows/profile-stats.yml'
permissions:
  contents: write
concurrency:
  group: profile-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_stats.py
      - name: Commit refreshed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg assets/languages.svg assets/stats-data.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh public profile stats'
          git push
