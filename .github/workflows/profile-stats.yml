name: Refresh profile stats
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_stats.py'
      - '.github/workflows/profile-stats.yml'
permissions:
  contents: write
concurrency:
  group: profile-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Commit refreshed cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # Keep a newer README/workflow commit and regenerate only the stats files.
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            python3 scripts/update_stats.py
            git add assets/stats.svg assets/languages.svg assets/stats-data.json
            if git diff --cached --quiet; then
              echo 'Stats already up to date.'
              exit 0
            fi
            git commit -m 'Refresh public profile stats'
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push raced another commit (attempt $attempt of 3); retrying."
          done
          echo 'Unable to push after 3 attempts.' >&2
          exit 1
